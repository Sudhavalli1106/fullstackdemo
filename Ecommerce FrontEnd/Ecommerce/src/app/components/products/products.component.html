<div class="container">
  <h2 class="my-3">Products List</h2>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.product_id }}</td>
        <td>{{ product.product_name }}</td>
        <td>${{ product.product_price }}</td>
         <td>
     <button [routerLink]="['/products', product.product_id]">View</button>
      <button [routerLink]="['/edit-product', product.product_id]">Edit</button>
      <button (click)="deleteProduct(product.product_id)">Delete</button>
    </td>
      </tr>
    </tbody>
  </table>
</div>
